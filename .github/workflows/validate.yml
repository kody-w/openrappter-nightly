name: Validate ring pointer
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-manifest.mjs .ring/manifest.json nightly
