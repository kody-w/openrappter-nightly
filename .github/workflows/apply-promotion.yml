name: Apply next ordered promotion request
on:
  workflow_dispatch:
    inputs:
      request_sequence: { required: false, type: number, default: 0 }
  schedule: [{ cron: '17 * * * *' }]
permissions: { contents: read }
concurrency: { group: apply-nightly, cancel-in-progress: false }
jobs:
  apply:
    permissions: { contents: write }
    uses: kody-w/openrappter-release-train/.github/workflows/apply-request.yml@5d91457c477a8b043af9ee4881d2941d1b834616
    with: { requested_sequence: '${{ inputs.request_sequence || 0 }}', target_ring: nightly, target_repository: kody-w/openrappter-nightly }
