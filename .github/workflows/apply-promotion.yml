name: Apply next ordered promotion request
on:
  workflow_dispatch:
    inputs:
      request_sequence:
        required: false
        type: string
        default: '0'
  schedule: [{ cron: '17 * * * *' }]
permissions: { contents: read }
concurrency: { group: apply-nightly, cancel-in-progress: false }
jobs:
  apply:
    permissions: { contents: write }
    uses: kody-w/openrappter-release-train/.github/workflows/apply-request.yml@ee264e0e9f6d5022747518ac332dcc47f52c07a6
    with:
      requested_sequence: ${{ inputs.request_sequence || '0' }}
      target_ring: nightly
      target_repository: kody-w/openrappter-nightly
